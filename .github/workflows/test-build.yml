name: Test and rebuild downloadable app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run tests
        run: node --test *.test.cjs
      - name: Verify downloadable HTML is reproducible
        run: |
          python3 build.py
          git diff --exit-code -- Formnest.html
